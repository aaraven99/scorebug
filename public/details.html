<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Scorebug — Game details</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/details.css"><script type="module" src="/details-runtime.js"></script></head><body class="details-page"><main class="game-details" aria-label="Live game details"><header class="details-header"><div><span class="details-eyebrow" id="details-phase">GAME DETAILS</span><h1 id="details-match">Connecting…</h1></div><button id="details-close" type="button" aria-label="Close game details" title="Close details">×</button></header><section class="field-section" aria-label="Current ball position"><div class="field-heading"><strong id="field-position">Waiting for field position</strong><span id="field-down"></span></div><div id="field-visual"></div><div class="field-legend" id="field-legend" hidden><span><i class="ball-key"></i>Ball</span><span><i class="first-down-key"></i>Line to gain</span><span class="field-direction">Offense moves →</span></div></section><section class="play-section"><div class="section-title"><h2>Latest play</h2><span id="play-time"></span></div><p id="details-play">Waiting for the live feed…</p></section><section class="stats-section" aria-label="Current team statistics"><div class="stats-title"><h2>Team stats</h2><span id="stats-status">Loading…</span></div><table><thead><tr><th scope="col" class="stat-label">Game totals</th><th scope="col" id="stats-away">Away</th><th scope="col" id="stats-home">Home</th></tr></thead><tbody id="stats-body"></tbody></table><p id="stats-error" hidden role="status"></p></section><footer class="details-footer"><span id="details-age">Checking scores</span><span>ESPN feed</span></footer></main></body></html>
