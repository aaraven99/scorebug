<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Scorebug — Team stats</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/details.css"><script type="module" src="/details-runtime.js"></script></head>
<body class="details-page" data-phase="closed" data-direction="right"><main class="team-details" aria-label="Current team statistics">
<div class="blade-reveal">
  <svg class="blade-frame" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" preserveAspectRatio="none"><defs><linearGradient id="blade-fill" x1="0" y1="0" x2=".12" y2="1"><stop offset="0" class="blade-light"/><stop offset=".35" class="blade-team"/><stop offset="1" class="blade-dark"/></linearGradient><linearGradient id="blade-bevel" x1="0" y1="0" x2=".1" y2="1"><stop offset="0" stop-color="#e5e6dc"/><stop offset=".45" stop-color="#9ca29a"/><stop offset="1" stop-color="#555f58"/></linearGradient></defs><path id="blade-outline" fill="url(#blade-fill)" stroke="url(#blade-bevel)" stroke-width="1.6" stroke-linejoin="miter"/></svg>
  <div class="blade-content">
  <header class="details-header"><img id="details-logo" alt="" width="29" height="29" hidden><div><span id="details-name">TEAM STATS</span><h1 id="details-match">Connecting…</h1></div><button id="details-close" type="button" aria-label="Close team stats" title="Close stats">×</button></header>
  <div class="stats-scroll"><table role="table" aria-label="Team game totals"><tbody id="stats-body" role="rowgroup"></tbody></table></div>
  <div class="field-line"><strong id="field-position">Waiting for the feed</strong><span id="field-down"></span></div>
  <p id="details-play">Waiting for a reported play.</p>
  <footer class="details-footer"><span id="stats-status" role="status">Loading…</span><span id="details-source"></span></footer>
</div></div></main></body></html>
