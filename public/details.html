<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Scorebug — Team stats</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/details.css"><script type="module" src="/details-runtime.js"></script><script defer src="https://cdn.vercel-insights.com/v1/script.js"></script></head>
<body class="details-page"><main class="team-details" aria-label="Current team statistics">
  <header class="details-header"><img id="details-logo" alt="" width="29" height="29" hidden><div><span id="details-name">TEAM STATS</span><h1 id="details-match">Connecting…</h1></div><button id="details-close" type="button" aria-label="Close team stats" title="Close stats">×</button></header>
  <div class="stats-scroll"><table aria-label="Team game totals"><tbody id="stats-body"></tbody></table></div>
  <div class="field-line"><strong id="field-position">Waiting for the feed</strong><span id="field-down"></span></div>
  <p id="details-play">Waiting for a reported play.</p>
  <footer class="details-footer"><span id="stats-status" role="status">Loading…</span><span id="details-source"></span></footer>
</main></body></html>
