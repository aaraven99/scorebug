name: Verify Scorebug and build desktop apps

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the tested main commit as the latest desktop release
        type: boolean
        required: false
        default: false
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.publish_release && 'publish' || 'build' }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') && (github.event_name != 'workflow_dispatch' || !inputs.publish_release) }}

jobs:
  browser-qa:
    name: Browser QA · ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            suite: all
          - browser: webkit
            suite: flows
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Install the actual browser and system libraries
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Test all leagues and styles and repeated user workflows
        run: node scripts/qa-scorebug.mjs --suite ${{ matrix.suite }} --passes 3 --browser ${{ matrix.browser }}
      - name: Preserve QA results and visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Scorebug-Browser-QA-${{ matrix.browser }}
          path: test-results/qa/
          if-no-files-found: error
          retention-days: 30

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Install desktop dependencies
        run: npm ci --prefix desktop
      - name: Check release version
        run: python scripts/package_windows_release.py --check-tag
      - name: Check automatic-update packaging
        run: python scripts/test_package_windows_release.py
      - name: Check combined desktop release verification
        run: python scripts/test_combine_desktop_release.py
      - name: Check live data and event detection
        run: npm test
      - name: Verify Vercel static build
        run: npm run build
      - name: Check desktop geometry and update lifecycle
        run: npm test --prefix desktop
      - name: Verify real Windows widget, preload and positioning
        timeout-minutes: 3
        run: npm run test:smoke --prefix desktop
      - name: Upload native integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Scorebug-Windows-smoke
          path: desktop/release/smoke/
          if-no-files-found: ignore
          retention-days: 14
      - name: Build portable app and installer
        run: npm run dist:win --prefix desktop
      - name: Package downloads and verify automatic-update files
        run: python scripts/package_windows_release.py
      - name: Upload Windows downloads
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Scorebug-Windows-x64
          path: desktop/release/publish/
          if-no-files-found: error
          retention-days: 30

  macos:
    name: Mac ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            app_dir: mac-arm64
          - runner: macos-15-intel
            arch: x64
            app_dir: mac
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Ad-hoc signing uses no certificate or secret, including on PR builds.
      CSC_FOR_PULL_REQUEST: 'true'
      # Intel hosted VMs cannot initialize Chromium's hardware compositor.
      # This is used only by smoke mode; normal packaged launches keep the GPU.
      SCOREBUG_SMOKE_SOFTWARE_RENDERING: ${{ matrix.arch == 'x64' && '1' || '0' }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up native Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Require the claimed native architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          node - <<'JS'
          const { spawnSync } = require('node:child_process');
          const nativeAppleSilicon = spawnSync('sysctl', ['-n', 'hw.optional.arm64'], {encoding:'utf8'}).stdout?.trim() === '1';
          if (process.platform !== 'darwin' || process.arch !== process.env.EXPECTED_ARCH || nativeAppleSilicon !== (process.arch === 'arm64')) {
            throw Error('This job must test native Mac hardware, not translated code');
          }
          JS
      - name: Install web dependencies
        run: npm ci
      - name: Install desktop dependencies
        run: npm ci --prefix desktop
      - name: Check release version
        run: python3 scripts/package_windows_release.py --check-tag
      - name: Check desktop geometry, preferences and update lifecycle
        run: npm test --prefix desktop
      - name: Build the Mac drag-release helper
        run: npm run build:mac-helper --prefix desktop
      - name: Verify real Mac windows, preload, snapping and full-screen mode
        timeout-minutes: 3
        run: npm run test:smoke --prefix desktop
      - name: Build the Mac app, DMG and ZIP
        run: npm run dist:mac --prefix desktop -- --${{ matrix.arch }}
      - name: Launch and verify the packaged Mac application
        timeout-minutes: 3
        env:
          SCOREBUG_SMOKE_EXECUTABLE: ${{ github.workspace }}/desktop/release/${{ matrix.app_dir }}/Scorebug.app/Contents/MacOS/Scorebug
        run: npm run test:smoke --prefix desktop
      - name: Verify Mac signature, architecture and download contents
        run: python3 scripts/package_macos_release.py --arch ${{ matrix.arch }}
      - name: Upload native Mac integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Scorebug-Mac-${{ matrix.arch }}-smoke
          path: |
            desktop/release/smoke/
            desktop/release/smoke-packaged/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Mac downloads
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Scorebug-Mac-${{ matrix.arch }}
          path: desktop/release/publish-mac/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish the tested Windows and Mac release
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release == true && github.ref == 'refs/heads/main')
    needs: [browser-qa, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: scorebug-desktop-release
      cancel-in-progress: false
    steps:
      - name: Check out the release verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download this run's tested Windows files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Scorebug-Windows-x64
          path: release-input/windows
      - name: Download this run's tested Apple Silicon files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Scorebug-Mac-arm64
          path: release-input/mac-arm64
      - name: Download this run's tested Intel Mac files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Scorebug-Mac-x64
          path: release-input/mac-x64
      - name: Verify every platform shares this commit and combine download checksums
        run: python3 scripts/combine_desktop_release.py --input-dir release-input --output-dir release
      - name: Publish assets for this version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*" >&2; exit 1; }
          get() {
            local attempt response
            for attempt in 1 2 3; do
              if response="$(gh api --method GET -H 'X-GitHub-Api-Version: 2022-11-28' "$@")"; then
                printf '%s\n' "$response"
                return 0
              fi
              if [ "$attempt" = 3 ]; then return 1; fi
              sleep "$attempt"
            done
          }
          RELEASE_TAG="$(jq -er '.tag' release/release-info.json)"
          release_version="$(jq -er '.version' release/release-info.json)"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$RELEASE_TAG" = "v$release_version"
          test "$(jq -er .commit release/release-info.json)" = "$RELEASE_COMMIT" || fail 'The artifact commit differs from this workflow run.'
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            test "${RELEASE_REF#refs/tags/}" = "$RELEASE_TAG" || fail 'The pushed tag differs from the tested package version.'
          else
            test "$RELEASE_REF" = refs/heads/main || fail 'Non-tag publication is allowed only from main.'
          fi
          versioned_installer="Scorebug-Setup-${release_version}-x64.exe"
          # Keep the human download alias and the versioned installer referenced
          # by electron-builder's unchanged manifest. All files stay in a draft
          # until verified; publish the manifest last within that draft as well.
          assets=(Scorebug-Portable-Windows.zip Scorebug-Setup-Windows.exe "$versioned_installer" "${versioned_installer}.blockmap" Scorebug-Mac-Apple-Silicon.dmg Scorebug-Mac-Apple-Silicon.zip Scorebug-Mac-Intel.dmg Scorebug-Mac-Intel.zip SHA256SUMS-Mac-Apple-Silicon.txt SHA256SUMS-Mac-Intel.txt START-HERE-MAC.txt SHA256SUMS.txt latest.yml)
          jq -e --arg installer "$versioned_installer" '(.platforms | sort) == (["windows-x64", "mac-arm64", "mac-x64"] | sort) and ([.assets[].name] | sort) == (["Scorebug-Portable-Windows.zip", "Scorebug-Setup-Windows.exe", $installer, ($installer + ".blockmap"), "Scorebug-Mac-Apple-Silicon.dmg", "Scorebug-Mac-Apple-Silicon.zip", "Scorebug-Mac-Intel.dmg", "Scorebug-Mac-Intel.zip", "SHA256SUMS-Mac-Apple-Silicon.txt", "SHA256SUMS-Mac-Intel.txt", "START-HERE-MAC.txt", "SHA256SUMS.txt", "latest.yml"] | sort)' release/release-info.json > /dev/null
          for asset in "${assets[@]}"; do
            digest="$(sha256sum "release/$asset" | cut -d ' ' -f 1)"
            bytes="$(stat -c %s "release/$asset")"
            jq -e --arg name "$asset" --arg hash "$digest" --argjson bytes "$bytes" 'any(.assets[]; .name == $name and .sha256 == $hash and .bytes == $bytes and .bytes > 0)' release/release-info.json > /dev/null
          done
          (cd release && sha256sum --check SHA256SUMS.txt)

          # Existing tags must resolve to this exact tested commit, including
          # annotated tags. Never move a tag to make an artifact appear valid.
          check_tag() {
            local depth kind sha
            tag_exists=false
            if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" > tag-state.json 2> tag-error.log; then
              tag_exists=true
              for depth in 1 2 3 4 5; do
                kind="$(jq -r .object.type tag-state.json)"
                sha="$(jq -r .object.sha tag-state.json)"
                if [ "$kind" = commit ]; then
                  test "$sha" = "$RELEASE_COMMIT" || fail 'The existing tag points to a different commit. Bump the version; do not overwrite it.'
                  return 0
                fi
                test "$kind" = tag || fail 'The release tag does not resolve to a commit.'
                get "repos/$GH_REPO/git/tags/$sha" > tag-state.json
              done
              fail 'Too many nested annotated tags.'
            fi
            grep -q 'HTTP 404' tag-error.log || { cat tag-error.log >&2; return 1; }
            if [ "${1:-optional}" = required ] || [[ "$RELEASE_REF" == refs/tags/* ]]; then
              fail 'The release tag is no longer available.'
            fi
          }
          check_tag

          # Authenticated list results include drafts. The by-tag endpoint is
          # published-only, so retain the numeric ID from lookup or creation.
          get --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > release-pages.json
          jq --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)]' release-pages.json > matching-releases.json
          count="$(jq length matching-releases.json)"
          test "$count" -le 1 || fail 'Multiple releases match this tag.'
          if [ "$count" = 0 ]; then
            jq -n --arg tag "$RELEASE_TAG" --arg sha "$RELEASE_COMMIT" --arg version "$release_version" \
              '{tag_name:$tag,target_commitish:$sha,name:("Scorebug "+$version),draft:true,prerelease:false,body:"Phone Standby is here: open sports-scorebug.vercel.app/standby.html on your phone, choose up to four games, turn the phone sideways and hide the controls. No app-store download is needed.\n\nFavorite-team search now searches all supported leagues. This update also fixes repeated animation exits, logo fallbacks, several layout issues and saved choices in Safari.\n\nWindows: download Scorebug-Setup-Windows.exe and run it. The installed Windows app updates automatically. The portable ZIP needs manual feature updates.\n\nMac: choose Scorebug-Mac-Apple-Silicon.dmg for an Apple-chip Mac, or Scorebug-Mac-Intel.dmg for Intel. Open the DMG and drag Scorebug to Applications. macOS 13 or newer is required. ZIP versions contain the same app.\n\nMac builds are ad-hoc signed, not Apple Developer ID signed or notarized. If macOS blocks the app and you trust this download, try opening it, then use System Settings > Privacy & Security > Open Anyway. Mac feature updates are manual for now: quit Scorebug and replace the app in Applications. Favorites and layout carry over. Read START-HERE-MAC.txt for simple setup steps.\n\nChoose your sport, save favorite teams and try the style selector in Settings. Drag near a side edge for the compact vertical view. Hover a logo or timeout area for team stats; hover the center for a comparison.\n\nThis release passed repeated Chromium and WebKit user-flow checks, the complete league/style layout matrix, and native Windows, Apple Silicon Mac and Intel Mac checks, including launch tests of both packaged Mac apps. All public downloads and the Windows automatic-update files were verified before publication. Physical iPhone hardware is not part of these automated checks."}' > create-release.json
            gh api --method POST "repos/$GH_REPO/releases" --input create-release.json > release-state.json
          else
            jq '.[0]' matching-releases.json > release-state.json
          fi
          release_id="$(jq -er '.id | select(type == "number" and . > 0)' release-state.json)"
          read_release() {
            get "repos/$GH_REPO/releases/$release_id" > release-state.json
            jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag' release-state.json > /dev/null
            get --paginate --slurp "repos/$GH_REPO/releases/$release_id/assets?per_page=100" | jq 'add // []' > release-assets.json
          }
          asset_matches() {
            local asset="$1" digest bytes
            digest="sha256:$(sha256sum "release/$asset" | cut -d ' ' -f 1)"
            bytes="$(stat -c %s "release/$asset")"
            jq -e --arg name "$asset" --arg digest "$digest" --argjson bytes "$bytes" \
              '[.[] | select(.name == $name and .state == "uploaded" and .size == $bytes and .digest == $digest)] | length == 1' release-assets.json > /dev/null
          }
          read_release
          if [ "$(jq -r .draft release-state.json)" != true ]; then
            check_tag required
            for asset in "${assets[@]}"; do
              asset_matches "$asset" || fail 'This published release (possibly immutable) has different or missing assets. Bump the package version; published files are never clobbered.'
            done
            echo "Published $RELEASE_TAG already matches this run. No published assets changed."
            exit 0
          fi
          # GitHub ignores target_commitish when the tag already exists; the
          # exact tag check above also permits older drafts targeting main.
          jq -e --arg sha "$RELEASE_COMMIT" --argjson tagged "$tag_exists" '.immutable != true and (.target_commitish == $sha or $tagged)' release-state.json > /dev/null || fail 'The draft is immutable or targets a different commit. Use a new version or correct the draft before retrying.'

          for asset in "${assets[@]}"; do
            for attempt in 1 2 3; do
              read_release
              if asset_matches "$asset"; then break; fi
              jq -e '.draft == true and .immutable != true' release-state.json > /dev/null || fail 'The release was published during upload; refusing to replace its files.'
              # A failed upload may leave a starter asset. Replace mismatches
              # only while this exact release is still an editable draft.
              while read -r asset_id; do
                gh api --method DELETE "repos/$GH_REPO/releases/assets/$asset_id" > /dev/null
              done < <(jq -r --arg name "$asset" '.[] | select(.name == $name) | .id' release-assets.json)
              upload_url="$(jq -r '.upload_url | split("{")[0]' release-state.json)"
              test "$upload_url" = "https://uploads.github.com/repos/$GH_REPO/releases/$release_id/assets"
              if ! gh api --method POST "$upload_url?name=$asset" -H 'Content-Type: application/octet-stream' --input "release/$asset" > upload-state.json; then
                echo "::warning::Upload attempt $attempt failed for $asset; reconciling the draft before retry."
              fi
              sleep "$attempt"
              read_release
              if asset_matches "$asset"; then break; fi
            done
            asset_matches "$asset" || fail "The draft asset failed SHA-256 verification: $asset. The release remains unpublished."
          done
          read_release
          for asset in "${assets[@]}"; do asset_matches "$asset"; done
          check_tag
          if [ "$(jq -r .draft release-state.json)" = true ]; then
            jq -n --arg sha "$RELEASE_COMMIT" '{draft:false,prerelease:false,target_commitish:$sha,make_latest:"true"}' > publish-release.json
            if ! gh api --method PATCH "repos/$GH_REPO/releases/$release_id" --input publish-release.json > published-release.json; then
              # A lost response can follow a successful publication. Re-read
              # this ID before treating a retry as a failed or duplicate release.
              read_release
              jq -e '.draft == false' release-state.json > /dev/null || fail 'Publication failed; the verified draft is ready for a retry.'
            fi
          fi
          read_release
          jq -e '.draft == false and .prerelease == false' release-state.json > /dev/null
          check_tag required
          for asset in "${assets[@]}"; do asset_matches "$asset"; done
          echo "Published $RELEASE_TAG from $RELEASE_COMMIT after verifying every asset."
          curl --fail --silent --show-error --head --location --retry 3 --output /dev/null "https://github.com/$GH_REPO/releases/latest/download/Scorebug-Portable-Windows.zip"
          curl --fail --silent --show-error --head --location --retry 3 --output /dev/null "https://github.com/$GH_REPO/releases/latest/download/Scorebug-Setup-Windows.exe"
          curl --fail --silent --show-error --head --location --retry 3 --output /dev/null "https://github.com/$GH_REPO/releases/latest/download/latest.yml"
          curl --fail --silent --show-error --head --location --retry 3 --output /dev/null "https://github.com/$GH_REPO/releases/latest/download/Scorebug-Mac-Apple-Silicon.dmg"
          curl --fail --silent --show-error --head --location --retry 3 --output /dev/null "https://github.com/$GH_REPO/releases/latest/download/Scorebug-Mac-Intel.dmg"
