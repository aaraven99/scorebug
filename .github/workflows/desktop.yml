name: Build Windows desktop app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'public/**'
      - 'lib/**'
      - 'api/**'
      - 'server.mjs'
      - 'package.json'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop dependencies
        run: npm ci --prefix desktop
      - name: Check snapping geometry
        run: npm test --prefix desktop
      - name: Verify real Windows widget, preload and positioning
        timeout-minutes: 3
        run: npm run test:smoke --prefix desktop
      - name: Upload native integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Scorebug-Windows-smoke
          path: desktop/release/smoke/
          if-no-files-found: ignore
          retention-days: 14
      - name: Build portable app and installer
        run: npm run dist:win --prefix desktop
      - name: Upload Windows downloads
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Scorebug-Windows-x64
          path: desktop/release/*.exe
          if-no-files-found: error
          retention-days: 30
